name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL publique de L Art de la Connexion'
        required: false
        default: 'http://82.165.69.104'
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      APP_URL: ${{ inputs.app_url || secrets.APP_URL || 'http://82.165.69.104' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate APP_URL
        shell: bash
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL manquant"
            exit 1
          fi
          case "$APP_URL" in
            http://82.165.69.104|https://82.165.69.104|https://*) ;;
            *) echo "APP_URL invalide: $APP_URL"; exit 1;;
          esac
          echo "APP_URL=$APP_URL"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleRelease -PappUrl="$APP_URL"

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK générés :"
          find mobile/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find mobile/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Aucun APK trouvé après la compilation."
            exit 1
          fi
          cp "$APK" "LArtDeLaConnexion-${GITHUB_SHA::7}.apk"
          echo "APK final: LArtDeLaConnexion-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lart-de-la-connexion-apk
          path: LArtDeLaConnexion-*.apk
          if-no-files-found: error
          retention-days: 30
